<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de control — Yamilet Abdalh</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0714">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .panel { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .panel h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800; margin-bottom: 1.2rem; }
    .login { max-width: 420px; margin: 4rem auto; }
    .pestanas { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .8rem; margin-bottom: 1.6rem; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; }
    .kpi b { display: block; font: 800 1.8rem/1.1 "Bricolage Grotesque", sans-serif; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .kpi span { color: var(--muted); font-size: .82rem; }
    .lista { display: grid; gap: .8rem; }
    .ficha { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1rem 1.1rem; display: grid; gap: .45rem; }
    .ficha.urgente { border-color: #ff6b6b; }
    .ficha-cab { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; justify-content: space-between; }
    .ficha-cab b { font-size: 1.02rem; }
    .meta { color: var(--muted); font-size: .84rem; display: flex; flex-wrap: wrap; gap: .3rem 1rem; }
    .meta a { color: var(--accent); }
    .chip-estado { font-size: .72rem; font-weight: 600; padding: .15rem .55rem; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border-2); }
    .e-activo, .e-hecha, .e-resuelto, .e-pago { color: #35d07f; }
    .e-nuevo, .e-pendiente, .e-abierto, .e-en-curso { color: var(--accent-2); }
    .e-pago-fallido, .e-fallido, .e-cancelado, .e-cancelada, .e-no-asistio, .e-cancelacion, .e-reembolso { color: #ff6b6b; }
    .acciones { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .acciones select, .ficha textarea { background: var(--bg); color: var(--text); border: 1px solid var(--border-2); border-radius: 10px; padding: .45rem .6rem; font: inherit; font-size: .88rem; }
    .ficha textarea { width: 100%; min-height: 60px; resize: vertical; }
    .mini { padding: .45rem .8rem; font-size: .82rem; border-radius: 10px; }
    .texto-largo { white-space: pre-wrap; font-size: .9rem; color: var(--text); background: color-mix(in srgb, var(--bg) 60%, transparent); border-radius: 10px; padding: .6rem .75rem; }
    details.historial summary { cursor: pointer; color: var(--accent); font-size: .84rem; }
    details.historial ul { list-style: none; display: grid; gap: .25rem; margin-top: .4rem; font-size: .82rem; color: var(--muted); }
    .vacio { color: var(--muted); padding: 1rem 0; }
    .barra-sup { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="fondo" aria-hidden="true"><span></span><span></span><span></span></div>
  <header class="site-header">
    <a href="./" class="logo">Yamilet<span>.</span></a>
    <nav><span class="disponible">Panel privado</span><button class="btn btn-ghost mini" id="salir" hidden>Salir</button></nav>
  </header>

  <main class="panel">
    <section id="vista-login" class="login">
      <h1>Panel de control</h1>
      <form id="form-login" class="form">
        <div class="campo">
          <label for="token">Contraseña del panel</label>
          <input type="password" id="token" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" type="submit">Entrar</button>
        <p id="login-estado" class="estado" role="status"></p>
      </form>
    </section>

    <section id="vista-panel" hidden>
      <div class="barra-sup">
        <h1>Hola, Yamilet 👋</h1>
        <button class="btn btn-ghost mini" id="recargar">↻ Actualizar</button>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="pestanas" id="pestanas">
        <button class="filtro activo" data-vista="clientes">👥 Clientes</button>
        <button class="filtro" data-vista="llamadas">📞 Llamadas</button>
        <button class="filtro" data-vista="tickets">🆘 Soporte y quejas</button>
        <button class="filtro" data-vista="pagos">💳 Pagos</button>
      </div>
      <p id="panel-estado" class="estado" role="status"></p>
      <div class="lista" id="lista"></div>
    </section>
  </main>

  <script>
    (function () {
      var API = "/.netlify/functions/panel";
      var datos = null, vista = "clientes";
      var ESTADOS = {
        clientes: ["lead", "nuevo", "activo", "pago-fallido", "cancelado"],
        llamadas: ["pendiente", "hecha", "no-asistio", "cancelada"],
        tickets: ["abierto", "en-curso", "resuelto"],
      };
      var NOMBRES = {
        lead: "Interesado", nuevo: "Nuevo (por empezar)", activo: "Activo", "pago-fallido": "Pago fallido", cancelado: "Cancelado",
        pendiente: "Pendiente", hecha: "Hecha", "no-asistio": "No asistió", cancelada: "Cancelada",
        abierto: "Abierto", "en-curso": "En curso", resuelto: "Resuelto",
        pago: "Pago", fallido: "Fallido", cancelacion: "Cancelación", reembolso: "Reembolso",
      };

      function token() { try { return sessionStorage.getItem("panel-token") || ""; } catch (e) { return ""; } }
      function guardarToken(t) { try { t ? sessionStorage.setItem("panel-token", t) : sessionStorage.removeItem("panel-token"); } catch (e) {} }
      function esc(v) {
        return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function fecha(iso) { return iso ? new Date(iso).toLocaleString("es-ES", { dateStyle: "medium", timeStyle: "short", timeZone: "America/New_York" }) : ""; }
      function dinero(c) { return "$" + ((c || 0) / 100).toFixed(2); }
      function aviso(el, txt, clase) { el.textContent = txt; el.className = "estado " + (clase || ""); }

      function api(metodo, cuerpo) {
        return fetch(API, {
          method: metodo,
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token() },
          body: cuerpo ? JSON.stringify(cuerpo) : undefined,
        }).then(function (r) { return r.json().then(function (d) { if (!d.ok) throw new Error(d.error || "Error"); return d; }); });
      }

      function cargar() {
        aviso(document.getElementById("panel-estado"), "Cargando…");
        return api("GET").then(function (d) {
          datos = d;
          document.getElementById("vista-login").hidden = true;
          document.getElementById("vista-panel").hidden = false;
          document.getElementById("salir").hidden = false;
          aviso(document.getElementById("panel-estado"), "");
          pintar();
        });
      }

      function selector(coleccion, item) {
        return '<select data-estado="' + coleccion + '" data-id="' + esc(item.id) + '">' +
          ESTADOS[coleccion].map(function (e) {
            return '<option value="' + e + '"' + (item.estado === e ? " selected" : "") + ">" + NOMBRES[e] + "</option>";
          }).join("") + "</select>";
      }
      function chip(e) { return '<span class="chip-estado e-' + esc(e) + '">' + esc(NOMBRES[e] || e) + "</span>"; }
      function notas(coleccion, item, campo, etiqueta) {
        return '<textarea data-notas="' + coleccion + '" data-campo="' + campo + '" data-id="' + esc(item.id) + '" placeholder="' + etiqueta + '">' + esc(item[campo] || "") + "</textarea>" +
          '<div class="acciones"><button class="btn btn-ghost mini" data-guardar="' + coleccion + '" data-campo="' + campo + '" data-id="' + esc(item.id) + '">Guardar nota</button>' +
          '<button class="btn btn-ghost mini" data-borrar="' + coleccion + '" data-id="' + esc(item.id) + '">Borrar</button></div>';
      }

      function pintarKpis() {
        var c = datos.clientes, hoy = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
        var mes = hoy.slice(0, 7);
        var cobradoMes = datos.pagos.filter(function (p) { return p.tipo === "pago" && (p.fecha || "").slice(0, 7) === mes; })
          .reduce(function (s, p) { return s + (p.importe || 0); }, 0);
        var kpis = [
          [c.filter(function (x) { return x.estado === "activo"; }).length, "clientes activos"],
          [c.filter(function (x) { return x.estado === "nuevo"; }).length, "nuevos por empezar"],
          [c.filter(function (x) { return x.estado === "lead"; }).length, "interesados"],
          [datos.llamadas.filter(function (l) { return l.estado === "pendiente" && l.fecha >= hoy; }).length, "llamadas próximas"],
          [datos.tickets.filter(function (t) { return t.estado !== "resuelto"; }).length, "tickets abiertos"],
          [dinero(cobradoMes), "cobrado este mes"],
        ];
        document.getElementById("kpis").innerHTML = kpis.map(function (k) {
          return '<div class="kpi"><b>' + esc(k[0]) + "</b><span>" + k[1] + "</span></div>";
        }).join("");
      }

      var PINTORES = {
        clientes: function () {
          var orden = { "pago-fallido": 0, nuevo: 1, lead: 2, activo: 3, cancelado: 4 };
          return datos.clientes.sort(function (a, b) {
            return (orden[a.estado] - orden[b.estado]) || String(b.actualizado).localeCompare(String(a.actualizado));
          }).map(function (x) {
            var ini = x.inicio ? '<div class="texto-largo"><b>Formulario de inicio</b>\nNecesita: ' + esc(x.inicio.necesidad) +
              (x.inicio.enlaces ? "\nEnlaces: " + esc(x.inicio.enlaces) : "") + (x.inicio.estilo ? "\nEstilo: " + esc(x.inicio.estilo) : "") + "</div>" : "";
            var hist = (x.historial || []).slice().reverse().map(function (h) { return "<li>" + esc(fecha(h.fecha)) + " · " + esc(h.texto) + "</li>"; }).join("");
            return '<article class="ficha">' +
              '<div class="ficha-cab"><b>' + esc(x.nombre || "(sin nombre)") + (x.negocio ? " · " + esc(x.negocio) : "") + "</b>" + chip(x.estado) + "</div>" +
              '<div class="meta"><a href="mailto:' + esc(x.email) + '">' + esc(x.email) + "</a>" + (x.telefono ? "<span>📱 " + esc(x.telefono) + "</span>" : "") +
              (x.plan ? "<span>Plan " + esc(x.plan) + "</span>" : "") + "<span>Origen: " + esc(x.origen || "-") + "</span><span>Desde " + esc(fecha(x.creado)) + "</span></div>" +
              ini + '<details class="historial"><summary>Historial (' + (x.historial || []).length + ")</summary><ul>" + hist + "</ul></details>" +
              '<div class="acciones">Estado: ' + selector("clientes", x) + "</div>" + notas("clientes", x, "notas", "Notas privadas sobre este cliente…") +
              "</article>";
          }).join("");
        },
        llamadas: function () {
          var hoy = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
          return datos.llamadas.sort(function (a, b) {
            var fa = a.fecha >= hoy, fb = b.fecha >= hoy;
            if (fa !== fb) return fa ? -1 : 1;
            return fa ? (a.fecha + a.hora).localeCompare(b.fecha + b.hora) : (b.fecha + b.hora).localeCompare(a.fecha + a.hora);
          }).map(function (x) {
            return '<article class="ficha">' +
              '<div class="ficha-cab"><b>📅 ' + esc(x.fecha) + " · " + esc(x.hora) + " (Nueva York)</b>" + chip(x.estado) + "</div>" +
              '<div class="meta"><span>' + esc(x.nombre) + '</span><a href="mailto:' + esc(x.email) + "?subject=" + encodeURIComponent("Tu llamada con Yamilet: " + x.fecha + " " + x.hora) + '">' + esc(x.email) + "</a>" +
              (x.telefono ? "<span>📱 " + esc(x.telefono) + "</span>" : "") + "<span>Tema: " + esc(x.tema) + "</span></div>" +
              (x.mensaje ? '<div class="texto-largo">' + esc(x.mensaje) + "</div>" : "") +
              '<div class="acciones">Estado: ' + selector("llamadas", x) + "</div>" + notas("llamadas", x, "notas", "Notas de la llamada…") +
              "</article>";
          }).join("");
        },
        tickets: function () {
          var orden = { abierto: 0, "en-curso": 1, resuelto: 2 };
          return datos.tickets.sort(function (a, b) {
            return (orden[a.estado] - orden[b.estado]) || ((b.urgencia === "Urgente") - (a.urgencia === "Urgente")) || String(b.creado).localeCompare(String(a.creado));
          }).map(function (x) {
            return '<article class="ficha' + (x.urgencia === "Urgente" && x.estado !== "resuelto" ? " urgente" : "") + '">' +
              '<div class="ficha-cab"><b>' + esc(x.numero) + " · " + esc(x.tipo) + (x.urgencia === "Urgente" ? " · 🚨 Urgente" : "") + "</b>" + chip(x.estado) + "</div>" +
              '<div class="meta"><span>' + esc(x.nombre || (x.automatico ? "Agente de pagos" : "")) + "</span>" +
              (x.email ? '<a href="mailto:' + esc(x.email) + "?subject=" + encodeURIComponent("Re: " + x.numero + " · " + x.tipo) + '">Responder a ' + esc(x.email) + "</a>" : "") +
              "<span>" + esc(fecha(x.creado)) + "</span></div>" +
              '<div class="texto-largo">' + esc(x.mensaje) + "</div>" +
              '<div class="acciones">Estado: ' + selector("tickets", x) + "</div>" + notas("tickets", x, "respuesta", "Qué hiciste / qué respondiste…") +
              "</article>";
          }).join("");
        },
        pagos: function () {
          return datos.pagos.sort(function (a, b) { return String(b.fecha).localeCompare(String(a.fecha)); }).map(function (x) {
            return '<article class="ficha"><div class="ficha-cab"><b>' + (x.tipo === "pago" ? "+ " : "") + esc(dinero(x.importe)) + " · " + esc(x.motivo || "") + "</b>" + chip(x.tipo) + "</div>" +
              '<div class="meta"><span>' + esc(fecha(x.fecha)) + "</span><span>" + esc(x.nombre || "") + "</span>" + (x.email ? "<span>" + esc(x.email) + "</span>" : "") +
              (x.plan ? "<span>Plan " + esc(x.plan) + "</span>" : "") + "</div></article>";
          }).join("");
        },
      };
      var VACIOS = {
        clientes: "Aún no hay clientes. Aparecerán aquí cuando alguien escriba, reserve una llamada o pague.",
        llamadas: "Aún no hay llamadas reservadas.",
        tickets: "No hay tickets. ¡Todo tranquilo! 🎉",
        pagos: "Aún no hay pagos registrados. Llegan solos desde Stripe cuando el agente de pagos está conectado.",
      };

      function pintar() {
        pintarKpis();
        var html = PINTORES[vista]();
        document.getElementById("lista").innerHTML = html || '<p class="vacio">' + VACIOS[vista] + "</p>";
      }

      function accion(cuerpo, okTxt) {
        var est = document.getElementById("panel-estado");
        aviso(est, "Guardando…");
        return api("POST", cuerpo).then(function () { aviso(est, okTxt, "ok"); return cargar(); })
          .catch(function (e) { aviso(est, e.message, "error"); });
      }

      document.getElementById("lista").addEventListener("change", function (e) {
        var s = e.target.closest("select[data-estado]");
        if (s) accion({ accion: "actualizar", coleccion: s.dataset.estado, id: s.dataset.id, cambios: { estado: s.value } }, "Estado actualizado ✓");
      });
      document.getElementById("lista").addEventListener("click", function (e) {
        var g = e.target.closest("[data-guardar]");
        if (g) {
          var ta = document.querySelector('textarea[data-notas="' + g.dataset.guardar + '"][data-id="' + CSS.escape(g.dataset.id) + '"]');
          var cambios = {}; cambios[g.dataset.campo] = ta.value;
          accion({ accion: "actualizar", coleccion: g.dataset.guardar, id: g.dataset.id, cambios: cambios }, "Nota guardada ✓");
        }
        var b = e.target.closest("[data-borrar]");
        if (b) {
          if (b.dataset.confirmar !== "1") { b.dataset.confirmar = "1"; b.textContent = "¿Seguro? Pulsa otra vez"; return; }
          accion({ accion: "borrar", coleccion: b.dataset.borrar, id: b.dataset.id }, "Borrado ✓");
        }
      });
      document.getElementById("pestanas").addEventListener("click", function (e) {
        var p = e.target.closest("[data-vista]");
        if (!p) return;
        vista = p.dataset.vista;
        document.querySelectorAll("#pestanas .filtro").forEach(function (x) { x.classList.toggle("activo", x === p); });
        pintar();
      });
      document.getElementById("recargar").addEventListener("click", function () { cargar().catch(function (e) { aviso(document.getElementById("panel-estado"), e.message, "error"); }); });
      document.getElementById("salir").addEventListener("click", function () { guardarToken(""); location.reload(); });
      document.getElementById("form-login").addEventListener("submit", function (e) {
        e.preventDefault();
        guardarToken(document.getElementById("token").value.trim());
        var est = document.getElementById("login-estado");
        aviso(est, "Entrando…");
        cargar().catch(function (err) { guardarToken(""); aviso(est, err.message, "error"); });
      });

      if (token()) cargar().catch(function () { guardarToken(""); });
    })();
  </script>
</body>
</html>
