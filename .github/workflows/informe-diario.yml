name: Informe diario de la web

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC cada día (Google/GitHub usan hora UTC)
  workflow_dispatch: {}     # botón para lanzarlo a mano desde la pestaña Actions

jobs:
  enviar-informe:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a la función de informe
        run: |
          curl -sS --retry 2 --retry-delay 10 \
            "https://yamilet-abdalh-web.netlify.app/.netlify/functions/informe-diario${INFORME_QS}" || true
        env:
          # Si defines INFORME_TOKEN en Netlify, añade también el secreto
          # INFORME_TOKEN en GitHub (Settings -> Secrets -> Actions) y esto lo usará.
          INFORME_QS: ${{ secrets.INFORME_TOKEN && format('?t={0}', secrets.INFORME_TOKEN) || '' }}
